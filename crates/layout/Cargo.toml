[dev-dependencies]
tempfile.workspace = true
# Path-only (no version) so it is stripped from the published manifest, avoiding
# the layout <-> registry circular dev-dep at publish time.
containerregistry-registry = { path = "../registry" }
containerregistry-server = { path = "../server" }
