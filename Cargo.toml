[workspace]
resolver = "2"
members = [
    ".",
    "crates/image",
    "crates/v1",
    "crates/layout",
    "crates/registry",
    "crates/auth",
    "crates/testing",
    "crates/server",
    "bins/crane",
    "bins/gcrane",
]

[package]
name = "containerregistry"
description = "Rust client libraries for OCI container registries"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
containerregistry-image.workspace = true
containerregistry-v1.workspace = true
containerregistry-layout.workspace = true
containerregistry-registry.workspace = true
containerregistry-auth.workspace = true
containerregistry-server = { workspace = true, optional = true }

[features]
# The in-process registry (go-containerregistry pkg/registry); pulls in axum.
server = ["dep:containerregistry-server"]

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "MIT OR Apache-2.0"
authors = ["ArcBox Labs <oss@arcbox.dev>", "AprilNEA <dev@aprilnea.me>"]
repository = "https://github.com/arcbox-labs/containerregistry-rs"

[workspace.dependencies]
# Workspace crates
containerregistry-image = { version = "0.2.0", path = "crates/image" }
containerregistry-v1 = { version = "0.2.0", path = "crates/v1" }
containerregistry-layout = { version = "0.2.0", path = "crates/layout" }
containerregistry-registry = { version = "0.2.0", path = "crates/registry" }
containerregistry-auth = { version = "0.2.0", path = "crates/auth" }
containerregistry-testing = { version = "0.2.0", path = "crates/testing" }
containerregistry-server = { version = "0.2.0", path = "crates/server" }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Async runtime
tokio = { version = "1", features = ["full"] }

# HTTP client
reqwest = { version = "0.12", features = ["json", "stream"] }

# Error handling
thiserror = "2"
anyhow = "1"

# Crypto (for digest computation)
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"

# CLI
clap = { version = "4", features = ["derive"] }

# Logging/tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# HTTP utilities
httpdate = "1"

# Async I/O and streams
bytes = "1"
futures = "0.3"
tokio-util = { version = "0.7", features = ["io", "io-util"] }
async-trait = "0.1"
async-compression = { version = "0.4", features = ["tokio", "gzip", "zstd"] }
tar = "0.4"
rand = "0.9"

# HTTP server (registry)
axum = "0.8"

# Testing
tempfile = "3"
flate2 = "1"
zstd = "0.13"
